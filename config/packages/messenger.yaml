framework:
    messenger:
        failure_transport: publication_failures
        transports:
            background:
                dsn: 'doctrine://default'
                options:
                    queue_name: background
                    auto_setup: false
                    redeliver_timeout: 300
                    use_notify: false
                retry_strategy:
                    max_retries: 5
                    delay: 30000
            video_edits:
                dsn: 'doctrine://default'
                options:
                    queue_name: video_edits
                    auto_setup: false
                    redeliver_timeout: 600
                    use_notify: false
                retry_strategy:
                    max_retries: 3
                    delay: 30000
            publications:
                dsn: 'doctrine://default'
                options:
                    queue_name: publications
                    auto_setup: false
                    redeliver_timeout: 300
                    use_notify: false
                retry_strategy:
                    max_retries: 5
                    delay: 30000
            publication_failures:
                dsn: 'doctrine://default'
                options:
                    queue_name: publication_failures
                    auto_setup: false
                    use_notify: false
        routing:
            App\Message\BuildEditWaveform: video_edits
            App\Message\TranscribeVideoEdit: video_edits
            App\Message\RenderVideoEdit: video_edits
            App\Message\GenerateAiVideo: background
            App\Message\DispatchScheduledPublication: publications
            App\Message\PublishYouTube: publications
            App\Message\PublishInstagram: publications
            App\Message\PublishTikTok: publications
            App\Message\RefreshPublicationStatistics: background
