name: vydflow
services:
  php:
    image: vydflow-php
    build: ./docker/php
    ports: ["127.0.0.1:8000:8000"]
    volumes: &app_volumes [".:/app", "php_vendor:/app/vendor", "app_cache:/app/var/cache", "./docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro"]
    environment: &app_environment
      DATABASE_URL: postgresql://shortflow:localdev@database:5432/shortflow?serverVersion=16&charset=utf8
      MAILER_DSN: smtp://mailpit:1025
    depends_on:
      database:
        condition: service_healthy
      mailpit:
        condition: service_started
  worker:
    image: vydflow-php
    pull_policy: never
    init: true
    command: ["sh", "/app/docker/php/worker.sh"]
    restart: unless-stopped
    stop_grace_period: 5m
    volumes: *app_volumes
    environment:
      <<: *app_environment
      APP_ENV: dev
      APP_DEBUG: "0"
    depends_on:
      php:
        condition: service_started
      database:
        condition: service_healthy
  background-worker:
    image: vydflow-php
    pull_policy: never
    init: true
    command: ["sh", "/app/docker/php/worker.sh"]
    restart: unless-stopped
    stop_grace_period: 5m
    volumes: *app_volumes
    environment:
      <<: *app_environment
      APP_ENV: dev
      APP_DEBUG: "0"
      MESSENGER_QUEUE: background
    depends_on:
      php:
        condition: service_started
      database:
        condition: service_healthy
  mailpit:
    image: axllent/mailpit:v1.27.8
    ports: ["127.0.0.1:8026:8025"]
  edit-worker:
    image: vydflow-edit
    build: ./docker/edit
    init: true
    command: ["sh", "/app/docker/php/worker.sh"]
    restart: unless-stopped
    stop_grace_period: 5m
    cpus: 2
    mem_limit: 2g
    volumes: *app_volumes
    environment:
      <<: *app_environment
      APP_ENV: dev
      APP_DEBUG: "0"
      MESSENGER_QUEUE: video_edits
    depends_on:
      php:
        condition: service_started
      database:
        condition: service_healthy
  database:
    image: postgres:16-alpine
    # Local database tools (VS Code); never bind PostgreSQL to all interfaces.
    ports: ["127.0.0.1:5433:5432"]
    environment:
      POSTGRES_DB: shortflow
      POSTGRES_USER: shortflow
      POSTGRES_PASSWORD: localdev
    volumes: ["database_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortflow -d shortflow"]
      interval: 5s
      timeout: 5s
      retries: 20
  node:
    image: node:22-alpine
    working_dir: /app
    volumes: [".:/app", "node_modules:/app/node_modules"]
    profiles: ["tools"]
    command: sh -c "npm ci && npm run build"
volumes:
  database_data:
    # Existing local volume retained to preserve all developer data.
    name: shortflow_database_data
  node_modules:
  app_cache:
  php_vendor:
