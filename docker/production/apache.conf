ServerName localhost

<VirtualHost *:80>
    DocumentRoot /app/public
    DirectoryIndex index.php
    LimitRequestBody 110100480
    ServerSignature Off
    ErrorLog /proc/self/fd/2
    SetEnvIf Request_URI "^/media/(instagram|tiktok)/" private_media
    CustomLog /proc/self/fd/1 "%h %t \"%m %U %H\" %>s %b" env=!private_media

    <Directory /app/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>
</VirtualHost>
